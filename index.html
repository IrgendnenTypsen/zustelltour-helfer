<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a1d23">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Zustelltour Helfer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: eine Spalte fürs Handy – Kopf, nächster Stopp groß, Skizze, Liste. Farben wie die Zustelltour-App. */
:root {
  --bg: #f4f3ef; --surface: #ffffff; --surface-2: #ebe9e3; --ink: #1b1d22; --ink-2: #5d6068; --line: #d9d6ce;
  --accent: #1d4ed8; --accent-ink: #ffffff; --ok: #2f9e44; --ok-ink: #ffffff; --next: #f08c00; --done: #9aa0ab;
  --note-bg: #fff3bf; --note-ink: #5c4400; --chip-bg: #e3e1da; --start: #2f9e44; --end: #1b1d22;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #1a1d23; --surface-2: #242830; --ink: #eceef2; --ink-2: #9aa0ab; --line: #2e333c;
    --accent: #6d9bff; --accent-ink: #0b1020; --ok: #40c057; --ok-ink: #06210c; --next: #ffa94d; --done: #5d6370;
    --note-bg: #3b3210; --note-ink: #ffe28a; --chip-bg: #2c313a; --start: #40c057; --end: #adb5bd; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1a1d23; --surface-2: #242830; --ink: #eceef2; --ink-2: #9aa0ab; --line: #2e333c;
  --accent: #6d9bff; --accent-ink: #0b1020; --ok: #40c057; --ok-ink: #06210c; --next: #ffa94d; --done: #5d6370;
  --note-bg: #3b3210; --note-ink: #ffe28a; --chip-bg: #2c313a; --start: #40c057; --end: #adb5bd; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 var(--font); }
.wrap { max-width: 640px; margin: 0 auto; padding-block: 14px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 12px; }
h1 { font-size: 20px; margin: 0; text-wrap: balance; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.eyebrow { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { display: inline-flex; gap: 4px; align-items: center; border-radius: 7px; padding: 2px 8px; font-weight: 700; font-size: 13px; background: var(--chip-bg); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.sp { color: #fff; }
.chip.lg { font-size: 18px; padding: 6px 12px; border-radius: 9px; }
.chip .d { font-size: 11px; font-weight: 600; border-left: 1px solid currentColor; padding-left: 5px; opacity: .9; }
.note { background: var(--note-bg); color: var(--note-ink); border-radius: 8px; padding: 6px 9px; font-weight: 600; font-size: 14px; }
.flag { display: inline-block; font: 800 10px/1 var(--font); text-transform: uppercase; letter-spacing: .05em; padding: 3px 5px; border-radius: 5px; color: #fff; vertical-align: 1px; }
.flag.s { background: var(--start); } .flag.e { background: var(--end); color: var(--bg); }
.stat { display: flex; gap: 18px; flex-wrap: wrap; }
.stat b { display: block; font: 700 26px/1.1 var(--font-num); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }
.cur { border: 2px solid var(--accent); }
.where { font: 800 30px/1.1 var(--font-num); }
.btn { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 11px; height: 46px; padding: 0 14px; font: 600 15px var(--font); display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; cursor: pointer; }
.btn.ok { background: var(--ok); color: var(--ok-ink); border-color: transparent; height: 62px; font-size: 20px; border-radius: 14px; }
.btn.block { width: 100%; }
.btn:focus-visible, .item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.map { width: 100%; aspect-ratio: 4 / 3; max-width: 100%; display: block; background: var(--surface-2); border-radius: 10px; touch-action: manipulation; }
.list { display: grid; gap: 6px; }
.street { font-weight: 700; font-size: 13px; padding: 8px 2px 0; color: var(--ink-2); }
.item { display: grid; grid-template-columns: 30px 52px 1fr 34px; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 8px 10px; width: 100%; text-align: left; color: var(--ink); font: inherit; cursor: pointer; }
.item .nr { font: 600 12px var(--font-num); color: var(--ink-2); text-align: center; }
.item .hn { font: 800 22px/1 var(--font-num); text-align: center; }
.item .names { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .box { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; }
.item.done { opacity: .5; }
.item.done .box { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.item.now { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.empty { text-align: center; padding: 50px 10px; display: grid; gap: 10px; justify-items: center; }
.empty h1 { font-size: 22px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 14px; font-weight: 600; display: flex; gap: 14px; align-items: center; max-width: calc(100% - 32px); }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 800; text-transform: uppercase; font-size: 13px; cursor: pointer; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
</style>

<div class="wrap" id="app">
  <div class="empty" id="empty">
    <h1>Zustelltour Helfer</h1>
    <p class="muted" style="max-width:36ch;margin:0">Diese Seite zeigt deinen Teil einer Zeitungstour. Normalerweise öffnest du einfach den Link, den du bekommen hast. Falls hier trotzdem nichts erscheint: Kopiere den kompletten Link und füge ihn hier ein.</p>
    <label for="paste" class="muted small" style="justify-self:stretch;text-align:left">Link oder Code</label>
    <textarea id="paste" rows="4" placeholder="https://…#…" style="width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:10px;font:13px/1.35 var(--font)"></textarea>
    <button class="btn" id="open" type="button" style="justify-self:stretch;background:var(--accent);color:var(--accent-ink);border-color:transparent">Tour öffnen</button>
    <div id="perr" class="small" style="color:#e03131" hidden></div>
  </div>
</div>

<script>
(() => {
  const DOW = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
  const DOWL = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  async function unpack(tok) {
    const b64 = tok.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((tok.length + 3) % 4);
    const bin = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const ds = new DecompressionStream('deflate-raw');
    const txt = await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
    return JSON.parse(txt);
  }
  function decodePolyline(s) {
    const out = []; let i = 0, lat = 0, lng = 0;
    while (i < s.length) {
      for (const k of [0, 1]) {
        let r = 0, sh = 0, b;
        do { b = s.charCodeAt(i++) - 63; r |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20);
        const d = r & 1 ? ~(r >> 1) : r >> 1;
        if (k === 0) lat += d; else lng += d;
      }
      out.push([lat / 1e5, lng / 1e5]);
    }
    return out;
  }
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* ohne Speicher weiter */ } },
  };

  let D = null, done = {}, key = '', lastUndo = null;

  // Token aus Link, eingefügtem Text oder dem zuletzt geöffneten Stand holen
  const tokenFrom = (txt) => {
    const t = String(txt || '').trim();
    const h = t.includes('#') ? t.slice(t.lastIndexOf('#') + 1) : t;
    const clean = h.replace(/\s+/g, '');
    return /^[A-Za-z0-9_-]{40,}$/.test(clean) ? clean : '';
  };
  async function start(given) {
    let tok = given || tokenFrom(location.hash);
    if (!tok) tok = store.get('zt-helfer-last') || '';
    if (!tok) return;
    try { D = await unpack(tok); } catch {
      D = null;
      const err = $('#perr');
      if (err) { err.hidden = false; err.textContent = 'Der Link ist unvollständig oder beschädigt. Bitte lass ihn dir noch einmal schicken und kopiere ihn komplett.'; }
      return;
    }
    store.set('zt-helfer-last', tok);
    let h = 0; for (let i = 0; i < tok.length; i++) h = (h * 31 + tok.charCodeAt(i)) | 0;
    key = `zt-helfer-${h}`;
    done = store.get(key) || {};
    render();
  }

  const chip = (code, qty, days, lg) => {
    const col = D.c && D.c[code];
    const d = days ? `<span class="d">${esc(days)}</span>` : '';
    return `<span class="chip${col ? ' sp' : ''}${lg ? ' lg' : ''}"${col ? ` style="background:${esc(col)}"` : ''}>${qty}× ${esc(code)}${d}</span>`;
  };
  const chipsOf = (items, lg) => {
    const agg = new Map();
    items.forEach(([code, qty]) => agg.set(code, (agg.get(code) || 0) + qty));
    return [...agg].sort((a, b) => (a[0] === D.std ? -1 : b[0] === D.std ? 1 : a[0].localeCompare(b[0]))).map(([c, q]) => chip(c, q, '', lg)).join('');
  };
  const navUrl = (lat, lng) => `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`;

  let sk = null; // Projektion der aktuellen Skizze
  function dotsSvg(scale) {
    const { P, curIdx } = sk;
    return D.st.map((s, i) => {
      const [x, y] = P([s[2], s[3]]);
      const isDone = done[i], isCur = i === curIdx;
      const r = (isCur ? 14 : 11) * scale, fs = (isCur ? 13 : 11) * scale;
      return `<g data-i="${i}" style="cursor:pointer"><circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${r.toFixed(2)}" fill="${isCur ? 'var(--accent)' : isDone ? 'var(--ok)' : 'var(--surface)'}" stroke="${isDone ? 'var(--ok)' : isCur ? 'var(--accent)' : 'var(--ink)'}" stroke-width="${(2 * scale).toFixed(2)}"/>
        <text x="${x.toFixed(2)}" y="${(y + 4 * scale).toFixed(2)}" text-anchor="middle" font-size="${fs.toFixed(2)}" font-weight="700" fill="${isCur ? 'var(--accent-ink)' : isDone ? 'var(--ok-ink)' : 'var(--ink)'}" font-family="system-ui">${i + 1}</text></g>`;
    }).join('');
  }
  function sketch(curIdx) {
    const st = D.st;
    const line = D.g ? decodePolyline(D.g) : [[D.s[1], D.s[2]], ...st.map((s) => [s[2], s[3]]), [D.e[1], D.e[2]]];
    const all = [...line, [D.s[1], D.s[2]], [D.e[1], D.e[2]], ...st.map((s) => [s[2], s[3]])];
    const k = Math.cos((all[0][0] * Math.PI) / 180);
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    all.forEach(([la, lo]) => { const x = lo * k, y = -la; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); });
    const W = 400, H = 300, pad = 26;
    const sc = Math.min((W - 2 * pad) / ((x1 - x0) || 1e-6), (H - 2 * pad) / ((y1 - y0) || 1e-6));
    const ox = (W - (x1 - x0) * sc) / 2, oy = (H - (y1 - y0) * sc) / 2;
    const P = ([la, lo]) => [ox + (lo * k - x0) * sc, oy + (-la - y0) * sc];
    const path = line.map((p, i) => { const [x, y] = P(p); return `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`; }).join('');
    sk = { P, curIdx };
    const dots = `<g id="dots">${dotsSvg(1)}</g>`;
    const flag = (pt, label, fill) => { const [x, y] = P([pt[1], pt[2]]); return `<g class="flg" data-x="${x.toFixed(2)}" data-y="${y.toFixed(2)}"><rect x="${(x - 6).toFixed(1)}" y="${(y - 6).toFixed(1)}" width="12" height="12" rx="3" fill="${fill}" stroke="var(--surface)" stroke-width="2"/><text x="${x.toFixed(1)}" y="${(y - 10).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="800" fill="${fill}" font-family="system-ui">${label}</text></g>`; };
    const same = Math.abs(D.s[1] - D.e[1]) < 2e-4 && Math.abs(D.s[2] - D.e[2]) < 2e-4;
    return `<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Skizze der Strecke mit ${st.length} Stopps">
      <path class="ln0" d="${path}" fill="none" stroke="var(--surface)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      <path class="ln1" d="${path}" fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" opacity=".85"${D.g ? '' : ' stroke-dasharray="6 6"'}/>
      ${dots}${flag(D.s, same ? 'START/ZIEL' : 'START', 'var(--start)')}${same ? '' : flag(D.e, 'ZIEL', 'var(--end)')}
    </svg>`;
  }

  function render() {
    const st = D.st;
    const date = new Date(`${D.d}T12:00:00`);
    const curIdx = st.findIndex((_, i) => !done[i]);
    const nDone = st.filter((_, i) => done[i]).length;
    const per = {};
    st.forEach((s, i) => { if (!done[i]) s[4].forEach(([c, q]) => { per[c] = (per[c] || 0) + q; }); });
    const total = st.reduce((a, s) => a + s[4].reduce((b, it) => b + it[1], 0), 0);
    const rest = Object.values(per).reduce((a, b) => a + b, 0);
    const allPer = {};
    st.forEach((s) => s[4].forEach(([c, q]) => { allPer[c] = (allPer[c] || 0) + q; }));
    const perChips = (o) => Object.entries(o).sort((a, b) => (a[0] === D.std ? -1 : b[0] === D.std ? 1 : b[1] - a[1])).map(([c, q]) => chip(c, q)).join('');

    let html = `<div class="row"><div class="grow"><div class="eyebrow">${esc(DOWL[date.getDay()])}, ${date.getDate()}.${date.getMonth() + 1}. · Teil ${'ABCD'[D.p]} von ${D.of}</div><h1>${esc(D.n)}</h1></div></div>
      <div class="small"><span class="flag s">Start</span> ${esc(D.s[0])} &nbsp;→&nbsp; <span class="flag e">Ziel</span> ${esc(D.e[0])}</div>
      <div class="card">
        <div class="stat"><div><b>${st.length}</b><span>Adressen</span></div><div><b>${total}</b><span>Exemplare</span></div><div><b>${nDone}</b><span>erledigt</span></div></div>
        <div class="bar"><i style="width:${(nDone / st.length) * 100}%"></i></div>
        <div class="eyebrow">Mitnehmen</div><div class="chips">${perChips(allPer)}</div>
        ${nDone ? `<div class="small muted">Noch ${rest} Exemplare zu verteilen</div>` : ''}
      </div>`;

    if (curIdx >= 0) {
      const s = st[curIdx];
      const names = [...new Set(s[4].map((it) => it[2]).filter(Boolean))];
      const notes = [...new Set([...s[4].map((it) => it[3]), s[5]].filter(Boolean))];
      html += `<div class="card cur">
        <div class="eyebrow">Nächste Adresse · ${curIdx + 1} von ${st.length}</div>
        <div class="where">${esc(s[0])} ${esc(s[1])}</div>
        <div class="chips">${chipsOf(s[4], true)}</div>
        ${names.length ? `<div>${esc(names.join(' · '))}</div>` : ''}
        ${notes.map((n) => `<div class="note">${esc(n)}</div>`).join('')}
        <button class="btn ok block" data-act="done" type="button">Erledigt</button>
        <a class="btn block" href="${navUrl(s[2], s[3])}" target="_blank" rel="noopener">Navigation (Google Maps)</a>
      </div>`;
    } else {
      html += `<div class="card cur"><div class="eyebrow">Alles erledigt</div><div class="where">Fertig!</div>
        <div>Jetzt zum Treffpunkt: <b>${esc(D.e[0])}</b></div>
        <a class="btn block" href="${navUrl(D.e[1], D.e[2])}" target="_blank" rel="noopener">Navigation zum Ziel</a></div>`;
    }

    html += `<div class="card"><div class="row"><div class="eyebrow grow">Strecke</div><button class="btn" data-z="in" type="button" aria-label="Vergrößern" style="height:36px;width:40px;padding:0">+</button><button class="btn" data-z="out" type="button" aria-label="Verkleinern" style="height:36px;width:40px;padding:0">−</button><button class="btn" data-z="reset" type="button" style="height:36px">Ganz</button></div>${sketch(curIdx)}
      <div class="legend"><span><i style="background:var(--accent)"></i>dein Weg</span><span>Zwei Finger zoomen, ziehen verschiebt</span><span>Nummer antippen springt zur Adresse</span></div></div>`;

    html += `<div class="list" id="list">`;
    let last = null;
    st.forEach((s, i) => {
      if (s[0] !== last) { html += `<div class="street">${esc(s[0])}</div>`; last = s[0]; }
      const names = [...new Set(s[4].map((it) => it[2]).filter(Boolean))].join(', ');
      const notes = [...new Set([...s[4].map((it) => it[3]), s[5]].filter(Boolean))];
      html += `<button class="item${done[i] ? ' done' : ''}${i === curIdx ? ' now' : ''}" data-i="${i}" type="button" aria-pressed="${done[i] ? 'true' : 'false'}">
        <span class="nr">${i + 1}</span><span class="hn">${esc(s[1])}</span>
        <span style="display:grid;gap:3px;min-width:0"><span class="chips">${chipsOf(s[4])}</span>${names ? `<span class="names">${esc(names)}</span>` : ''}${notes.map((n) => `<span class="note" style="font-size:12.5px;padding:3px 7px">${esc(n)}</span>`).join('')}</span>
        <span class="box" aria-hidden="true">${done[i] ? '✓' : ''}</span></button>`;
    });
    html += `</div><p class="small muted" style="margin:0">Antippen hakt eine Adresse ab oder nimmt das Häkchen wieder weg. Der Stand bleibt in diesem Browser gespeichert.</p>
      <button class="btn" data-act="other" type="button">Anderen Link öffnen</button>`;
    $('#app').innerHTML = html;
    applyView();
  }

  // ---- Zoomen/Verschieben der Skizze (viewBox) ----
  let view = null; // {x,y,w,h}
  const BASE = { x: 0, y: 0, w: 400, h: 300 };
  function applyView() {
    const svg = document.querySelector('svg.map');
    if (!svg) return;
    const v = view || BASE;
    svg.setAttribute('viewBox', `${v.x} ${v.y} ${v.w} ${v.h}`);
    rescale(svg);
    bindGestures(svg);
  }
  function rescale(svg) {
    const k = (view || BASE).w / BASE.w; // <1 beim Reinzoomen → Punkte bleiben auf dem Bildschirm gleich groß
    const sc = Math.max(k, 0.12);
    const g = svg.querySelector('#dots');
    if (g && sk) g.innerHTML = dotsSvg(sc);
    svg.querySelector('.ln0')?.setAttribute('stroke-width', (7 * sc).toFixed(2));
    svg.querySelector('.ln1')?.setAttribute('stroke-width', (3.5 * sc).toFixed(2));
    svg.querySelectorAll('.flg').forEach((f) => f.setAttribute('transform', `translate(${f.dataset.x} ${f.dataset.y}) scale(${sc}) translate(${-f.dataset.x} ${-f.dataset.y})`));
  }
  function zoomAt(f, cx, cy) {
    const v = { ...(view || BASE) };
    const nw = Math.min(BASE.w, Math.max(BASE.w / 12, v.w / f));
    const nh = nw * (BASE.h / BASE.w);
    const px = cx ?? v.x + v.w / 2, py = cy ?? v.y + v.h / 2;
    v.x = px - (px - v.x) * (nw / v.w); v.y = py - (py - v.y) * (nh / v.h);
    v.w = nw; v.h = nh;
    view = nw >= BASE.w ? null : v;
    applyView();
  }
  function bindGestures(svg) {
    if (svg.dataset.bound) return;
    svg.dataset.bound = '1';
    const pts = new Map();
    let last = null;
    const toSvg = (cx, cy) => { const r = svg.getBoundingClientRect(); const v = view || BASE; return [v.x + ((cx - r.left) / r.width) * v.w, v.y + ((cy - r.top) / r.height) * v.h]; };
    svg.addEventListener('pointerdown', (e) => { pts.set(e.pointerId, [e.clientX, e.clientY]); last = null; });
    svg.addEventListener('pointermove', (e) => {
      if (!pts.has(e.pointerId)) return;
      const prev = pts.get(e.pointerId);
      pts.set(e.pointerId, [e.clientX, e.clientY]);
      const r = svg.getBoundingClientRect();
      if (pts.size === 1 && view) {
        const v = view;
        v.x -= ((e.clientX - prev[0]) / r.width) * v.w; v.y -= ((e.clientY - prev[1]) / r.height) * v.h;
        svg.setAttribute('viewBox', `${v.x} ${v.y} ${v.w} ${v.h}`);
        svg.dataset.moved = '1';
      } else if (pts.size === 2) {
        const [a, b] = [...pts.values()];
        const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
        if (last) { const [cx, cy] = toSvg((a[0] + b[0]) / 2, (a[1] + b[1]) / 2); zoomAt(d / last, cx, cy); }
        last = d;
        svg.dataset.moved = '1';
      }
    });
    const up = (e) => { pts.delete(e.pointerId); if (pts.size < 2) last = null; setTimeout(() => { svg.dataset.moved = ''; }, 0); };
    svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
    svg.addEventListener('wheel', (e) => { e.preventDefault(); const [cx, cy] = toSvg(e.clientX, e.clientY); zoomAt(e.deltaY < 0 ? 1.25 : 0.8, cx, cy); }, { passive: false });
    svg.style.touchAction = 'none';
  }

  function toast(msg, undo) {
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const el = document.createElement('div');
    el.className = 'toast'; el.setAttribute('role', 'status');
    el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Rückgängig</button>' : ''}`;
    if (undo) el.querySelector('button').onclick = () => { el.remove(); undo(); };
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }
  function setDone(i, v) {
    if (v) done[i] = Date.now(); else delete done[i];
    store.set(key, done);
    render();
  }

  document.addEventListener('click', (e) => {
    if (e.target.closest('#open')) {
      const tok = tokenFrom($('#paste').value);
      const err = $('#perr');
      if (!tok) { err.hidden = false; err.textContent = 'Das sieht nicht nach einem Tour-Link aus. Bitte den kompletten Link einfügen.'; return; }
      start(tok);
      return;
    }
    if (e.target.closest('[data-act=other]')) { store.set('zt-helfer-last', ''); location.hash = ''; location.reload(); return; }
    if (!D) return;
    const a = e.target.closest('[data-act=done]');
    if (a) {
      const i = D.st.findIndex((_, k) => !done[k]);
      if (i >= 0) {
        setDone(i, true);
        try { navigator.vibrate && navigator.vibrate(25); } catch { /* egal */ }
        toast(`${D.st[i][0]} ${D.st[i][1]} erledigt`, () => setDone(i, false));
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      return;
    }
    const z = e.target.closest('[data-z]');
    if (z) { if (z.dataset.z === 'reset') { view = null; applyView(); } else zoomAt(z.dataset.z === 'in' ? 1.6 : 0.625); return; }
    if (e.target.closest('svg.map')?.dataset.moved) return;
    const g = e.target.closest('svg [data-i]');
    if (g) { document.querySelector(`.item[data-i="${g.dataset.i}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    const it = e.target.closest('.item');
    if (it) { const i = Number(it.dataset.i); setDone(i, !done[i]); }
  });
  window.addEventListener('hashchange', () => start());
  start();
})();
</script>
